<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robot demo</title>
  <style>
    body { background: #04100c; color: #e8f1ee; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; }
    #demo-container { border: 1px solid #cfd8dc; border-radius: 14px; background: #000; overflow: hidden; line-height: 0; }
    .bar { display: flex; align-items: center; gap: 18px; font-size: 18px; }
    button { font-size: 18px; color: #e8f1ee; background: #3a4a4a; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>How the game works</h1>
  <div id="demo-container"></div>
  <div class="bar">
    <button id="prev">&lt;</button>
    <span id="count">1/3</span>
    <button id="next">&gt;</button>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
