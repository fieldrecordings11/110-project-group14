<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Byte Factory</title>
  </head>
  <body>
    <!-- Main screen: minigame - level roadmap - minigame -->
    <div id="hubScreen"></div>

    <!-- Level screen: opened by clicking a level on the roadmap -->
    <div id="levelScreen" hidden>
      <div id="pageContainer">
        <div id="outputPane">
          <h2 id="levelTitle"></h2>
          <div id="gameCanvas"></div>
          <div id="controls">
            <button id="backButton">Back to map</button>
            <button id="runButton">Run</button>
            <button id="resetButton">Reset</button>
          </div>
          <p id="status"></p>
          <pre id="generatedCode"><code></code></pre>
        </div>
        <div id="blocklyDiv"></div>
      </div>
    </div>
  </body>
</html>
